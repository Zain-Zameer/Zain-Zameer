# Put this file at:  .github/workflows/profile.yml  in your zain-zameer/zain-zameer repo
# It replaces snake.yml — delete that one if you added it.
#
# One-time setup:
#   1. Create a classic personal access token with the  public_repo  and  read:user  scopes
#      (GitHub > Settings > Developer settings > Personal access tokens).
#   2. In the zain-zameer repo: Settings > Secrets and variables > Actions > New repository secret
#      Name: SUMMARY_GITHUB_TOKEN   Value: the token
#   3. Actions tab > "Profile Cards" > Run workflow.

name: Profile Cards

on:
  schedule:
    - cron: "0 0 * * *"   # once a day
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats-cards:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: "main"
          UTC_OFFSET: 5
          THEME: "dracula"
          ANIMATION: "fade"

  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#7b2cbf&color_dots=#ebedf0,#e0aaff,#c77dff,#9d4edd,#5a189a
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#e0aaff&color_dots=#1a0033,#3c096c,#5a189a,#9d4edd,#c77dff

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
